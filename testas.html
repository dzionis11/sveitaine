{topic:'biologija',q:"Iš ko sudaryta chromosoma?",opts:["DNR ir baltymų","Tik DNR","Tik baltymų","Riebalų ir vandens"],a:0,exp:"DNR susivyniojusi su baltymais + centromera ir chromatidės."},
{topic:'biologija',q:"Kas yra kariotipas?",opts:["Organizmo somatinių ląstelių chromosomų visuma","Vienos chromosomos piešinys","Ligos pavadinimas","Fermento rūšis"],a:0,exp:"Kariotipas = visas chromosomų rinkinys."},
{topic:'biologija',q:"Kiek chromosomų žmogaus somatinėje ląstelėje?",opts:["46 (44 autosomos + 2 lytinės)","23","48","44"],a:0,exp:"46 = 44 vienodos visiems + XX arba XY."},
{topic:'biologija',q:"Kokios lytinės chromosomos moters ir vyro?",opts:["Moteris XX, vyras XY","Abu XX","Moteris XY, vyras XX","Abu XY"],a:0,exp:"XX – moteris, XY – vyras."},
{topic:'biologija',q:"Ką reiškia 2n ir n?",opts:["2n diploidinis (somatinės), n haploidinis (lytinės, 23)","2n – dvi ląstelės, n – viena","2n – vyras, n – moteris","Abu – tą patį"],a:0,exp:"Somatinėse – dvigubas rinkinys (2n=46), lytinėse – viengubas (n=23)."},

];
let quizQs=[],qIdx=0,score=0,answers=[];
function shuffleOpts(q){const order=q.opts.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}return {...q,opts:order.map(i=>q.opts[i]),a:order.indexOf(q.a)};}
function quizMatch(q,mode){if(mode==='istorija')return q.topic!=='anglu'&&q.topic!=='ekonomika'&&q.topic!=='biologija';if(mode==='all')return true;return q.topic===mode;}
function currentDalykas(){const m=document.getElementById('quizMode').value;return (m==='anglu'||m==='ekonomika'||m==='biologija')?m:'istorija';}
function paintDalykasTabs(){const d=currentDalykas();const EN=d==='anglu';const tabs={istorija:document.getElementById('tabIstorija'),anglu:document.getElementById('tabAnglu'),ekonomika:document.getElementById('tabEkonomika'),biologija:document.getElementById('tabBiologija')};const tabNames=EN?{istorija:'📜 History',anglu:'🇬🇧 English',ekonomika:'💰 Economics',biologija:'🧬 Biology'}:{istorija:'📜 Istorija',anglu:'🇬🇧 Anglų',ekonomika:'💰 Ekonomika',biologija:'🧬 Biologija'};Object.keys(tabs).forEach(function(k){tabs[k].textContent=tabNames[k];tabs[k].className='px-3 py-1.5 rounded-full '+(d===k?'bg-white shadow':'text-slate-500');});document.getElementById('dalykasName').textContent=d==='anglu'?'— English':(d==='ekonomika'?'— ekonomika':(d==='biologija'?'— biologija':'— istorija'));document.getElementById('testTitle').textContent=EN?'Test':'Testas';document.getElementById('btnRestart').textContent=EN?'Restart':'Iš naujo';document.getElementById('footCards').textContent=EN?'← Flashcards':'← Kortelės';document.getElementById('footPractice').textContent=EN?'Practice →':'Praktika →';const OPT={istorija:['Istorija (Steigiamasis Seimas)','History (Constituent Seimas)'],anglu:['Anglų: Modal verbs','English: Modal verbs'],ekonomika:['Ekonomika','Economics'],biologija:['Biologija','Biology']};Array.from(document.getElementById('quizMode').options).forEach(function(o){if(OPT[o.value])o.textContent=EN?OPT[o.value][1]:OPT[o.value][0];});paintNav(EN);}
function paintNav(EN){const m=EN?{'index.html':'📖 Learn','korteles.html':'🃏 Flashcards','testas.html':'✅ Test','praktika.html':'🧮 Practice'}:{'index.html':'📖 Mokytis','korteles.html':'🃏 Kortelės','testas.html':'✅ Testas','praktika.html':'🧮 Praktika'};document.querySelectorAll('#navMenu a').forEach(function(a){const f=a.getAttribute('href');if(m[f])a.textContent=m[f];});}
function topicName(t){return t==='anglu'?'modal verbs':t;}
function setDalykasMode(d){localStorage.setItem('dalykas',d);document.getElementById('quizMode').value=d;initQuiz();}
function initQuiz(){const mode=document.getElementById('quizMode').value;localStorage.setItem('dalykas',(mode==='anglu'||mode==='ekonomika'||mode==='biologija')?mode:'istorija');let pool=quizBank.filter(q=>quizMatch(q,mode)).map(shuffleOpts);pool=[...pool].sort(()=>Math.random()-0.5);quizQs=pool.slice(0,Math.min(25,pool.length));if(quizQs.length<5)quizQs=[...quizBank].map(shuffleOpts).sort(()=>Math.random()-0.5).slice(0,10);qIdx=0;score=0;answers=[];paintDalykasTabs();renderQuiz();}
function initDalykas(){const p=new URLSearchParams(window.location.search);const t=p.get('topic')||p.get('dalykas');const sel=document.getElementById('quizMode');const vals=Array.from(sel.options).map(o=>o.value);if(t&&vals.includes(t))sel.value=t;else{const ls=localStorage.getItem('dalykas');if(ls==='anglu'||ls==='ekonomika'||ls==='biologija')sel.value=ls;}}
function isEN(){return document.getElementById('quizMode').value==='anglu';}
function renderQuiz(){const prog=document.getElementById('quizProgress');prog.innerHTML='';quizQs.forEach((_,i)=>{const d=document.createElement('div');d.className='flex-1 h-2 rounded-full '+(i<qIdx?'bg-emerald-500':i===qIdx?'bg-blue-600':'bg-slate-200');prog.appendChild(d);});if(qIdx>=quizQs.length){showResult();return;}const q=quizQs[qIdx];const box=document.getElementById('quizBox');box.innerHTML=`<div class="flex justify-between text-xs"><span class="bg-slate-100 px-2 py-1 rounded-full font-bold">${topicName(q.topic).toUpperCase()}</span><span>${qIdx+1}/${quizQs.length}</span></div><h3 class="font-extrabold text-lg mt-3">${q.q}</h3><div class="grid gap-2 mt-4">${q.opts.map((o,i)=>`<button onclick="answer(${i})" class="text-left border-2 border-slate-200 rounded-xl px-4 py-3 hover:border-blue-300 hover:bg-blue-50 font-semibold">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div class="text-xs text-slate-400 mt-3">${isEN()?'Choose one answer':'Pasirink vieną atsakymą'}</div>`;document.getElementById('quizResult').classList.add('hidden');}
function answer(i){const q=quizQs[qIdx];const correct=i===q.a;answers.push(correct);if(correct)score++;const EN=isEN();const box=document.getElementById('quizBox');box.innerHTML=`<div class="text-xs bg-slate-100 px-2 py-1 rounded-full inline-block font-bold">${topicName(q.topic).toUpperCase()}</div><h3 class="font-extrabold text-lg mt-3">${q.q}</h3><div class="mt-3 p-3 rounded-xl ${correct?'bg-emerald-50 border border-emerald-200 text-emerald-800':'bg-red-50 border border-red-200 text-red-800'}"><b>${correct?(EN?'✓ Correct!':'✓ Teisingai!'):(EN?'✗ Wrong.':'✗ Neteisingai.')}</b> ${q.exp||''}</div><button onclick="nextQ()" class="w-full mt-4 bg-slate-900 text-white py-3 rounded-xl font-bold">${EN?'Next →':'Kitas →'}</button>`;}
function nextQ(){qIdx++;renderQuiz();}
function showResult(){const EN=isEN();const pct=Math.round(score/quizQs.length*100);let msg=EN?(pct>=80?"Excellent! 🌟":pct>=60?"Good! 👍":pct>=40?"Not bad, review the flashcards":"Keep practising 📖"):(pct>=80?"Puiku! 🌟":pct>=60?"Gerai! 👍":pct>=40?"Neplogai, pakartok korteles":"Reikia pasimokyti 📖");document.getElementById('quizBox').innerHTML=`<div class="text-center py-4"><div class="text-5xl">${pct>=80?'🏆':pct>=60?'🎉':'💪'}</div><h3 class="font-black text-2xl mt-2">${score}/${quizQs.length} (${pct}%)</h3><p class="font-bold text-slate-600">${msg}</p></div>`;document.getElementById('quizResult').classList.remove('hidden');document.getElementById('quizResult').innerHTML=`<h4 class="font-extrabold">${EN?'Review':'Apžvalga'}</h4><div class="grid gap-1 mt-2 text-left text-sm">${quizQs.map((q,i)=>`<div class="flex gap-2 items-center"><span class="${answers[i]?'bg-emerald-100 text-emerald-700':'bg-red-100 text-red-700'} w-6 h-6 rounded-full flex items-center justify-center text-xs">${answers[i]?'✓':'✗'}</span><span class="flex-1">${i+1}. ${q.q}</span><span class="text-xs">${q.opts[q.a]}</span></div>`).join('')}</div><button onclick="initQuiz()" class="w-full mt-4 bg-blue-700 text-white py-3 rounded-xl font-bold">${EN?'Repeat the test':'Kartoti testą'}</button>`;}
initDalykas();
initQuiz();
</script>
