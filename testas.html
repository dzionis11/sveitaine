{topic:'nepriklausomybe',q:"Ką Rusija įsipareigojo grąžinti Lietuvai pagal Maskvos taiką?",opts:["Archyvus, bibliotekas, meno vertybes, išvežtas nuo karo pradžios","Tik ginklus","Nieko","Tik pinigus"],a:0,exp:"Grąžinami archyvai, bibliotekos, mokslo įstaigų turtas ir meno vertybės, išvežti per karą."},
{topic:'nepriklausomybe',q:"Kas dar buvo numatyta Maskvos taikoje be sienų ir pinigų?",opts:["Karo belaisvių grąžinimas ir gyventojų teisė pasirinkti pilietybę (optacija)","Lietuvos kariuomenės panaikinimas","Bendros valstybės kūrimas","Muitų sąjunga"],a:0,exp:"Sutartis numatė belaisvių grąžinimą ir optaciją – teisę pasirinkti Lietuvos pilietybę."},
{topic:'nepriklausomybe',q:"Kas yra demarkacijos (demarkacinė) linija?",opts:["Laikina linija, skirianti kariuomenes, kol siena nustatoma sutartimi","Nuolatinė valstybės siena","Geležinkelio linija","Prekybos kelias"],a:0,exp:"Demarkacijos linija – laikinas kariuomenių atskyrimas, galioja tol, kol siena nustatoma sutartimi."},
{topic:'nepriklausomybe',q:"Kas yra nota?",opts:["Oficialus vienos valstybės vyriausybės raštas kitai (protestas, reikalavimas)","Taikos sutartis","Žemėlapio legenda","Karinis įsakymas"],a:0,exp:"Nota – oficialus diplomatinis raštas: juo reiškiamas protestas, reikalavimas ar informuojama."},
{topic:'nepriklausomybe',q:"Kas buvo Silvestras Žukauskas?",opts:["Lietuvos kariuomenės vadas Nepriklausomybės kovose","Lenkijos generolas","Bermontininkų vadas","Bolševikų vadas"],a:0,exp:"Generolas S. Žukauskas vadovavo Lietuvos kariuomenei kovose su bolševikais, bermontininkais ir lenkais."},
{topic:'nepriklausomybe',q:"Ką žemėlapyje rodo bolševikų prasiveržimo riba?",opts:["Ribą, iki kurios šiaurėje buvo prasiveržę bolševikai","Lietuvos ir Latvijos sieną","Suvalkų sutarties liniją","Vokietijos okupuotą zoną"],a:0,exp:"Prasiveržimo riba žemėlapyje žymi, kaip toli priešas buvo įsiveržęs – bolševikų atveju šiaurės Lietuvoje."},
{topic:'nepriklausomybe',q:"Ką žemėlapyje rodo bermontininkų prasiveržimo riba?",opts:["Ribą, iki kurios buvo prasiveržę bermontininkai (Šiaulių kryptis)","Lenkijos sieną","Maskvos taikos sieną","Tautų Sąjungos zoną"],a:0,exp:"Bermontininkai veržėsi į Šiaurės Lietuvą (Šiauliai, Radviliškis) – ten jie ir buvo sustabdyti."},
{topic:'nepriklausomybe',q:"Ką žemėlapyje reiškia X ženklai prie Giedraičių?",opts:["Mūšio vietą – Giedraičių mūšį 1920-11-17–21","Sostinę","Sienos perėją","Geležinkelio stotį"],a:0,exp:"X ženklai žymi mūšius. Giedraičiai – mūšis, kuriame lietuviai sustabdė lenkų veržimąsi."},
{topic:'nepriklausomybe',q:"Ką žemėlapyje rodo brūkšniuota (užtušuota) teritorija pietvakariuose?",opts:["Vokietijos užimtas teritorijas","Vilniaus kraštą","Neutralią zoną","Lenkijos sostinę"],a:0,exp:"Legendoje brūkšniavimas žymi Vokietijos užimtas teritorijas – jas atpažįsti iš legendos Nr. 7."}
];
let quizQs=[],qIdx=0,score=0,answers=[];
function shuffleOpts(q){const order=q.opts.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}return {...q,opts:order.map(i=>q.opts[i]),a:order.indexOf(q.a)};}
function initQuiz(){const mode=document.getElementById('quizMode').value;let pool=quizBank.filter(q=>mode==='all'||q.topic===mode).map(shuffleOpts);pool=[...pool].sort(()=>Math.random()-0.5);quizQs=pool.slice(0,Math.min(25,pool.length));if(quizQs.length<5)quizQs=[...quizBank].map(shuffleOpts).sort(()=>Math.random()-0.5).slice(0,10);qIdx=0;score=0;answers=[];renderQuiz();}
function renderQuiz(){const prog=document.getElementById('quizProgress');prog.innerHTML='';quizQs.forEach((_,i)=>{const d=document.createElement('div');d.className='flex-1 h-2 rounded-full '+(i<qIdx?'bg-emerald-500':i===qIdx?'bg-blue-600':'bg-slate-200');prog.appendChild(d);});if(qIdx>=quizQs.length){showResult();return;}const q=quizQs[qIdx];const box=document.getElementById('quizBox');box.innerHTML=`<div class="flex justify-between text-xs"><span class="bg-slate-100 px-2 py-1 rounded-full font-bold">${q.topic.toUpperCase()}</span><span>${qIdx+1}/${quizQs.length}</span></div><h3 class="font-extrabold text-lg mt-3">${q.q}</h3><div class="grid gap-2 mt-4">${q.opts.map((o,i)=>`<button onclick="answer(${i})" class="text-left border-2 border-slate-200 rounded-xl px-4 py-3 hover:border-blue-300 hover:bg-blue-50 font-semibold">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div class="text-xs text-slate-400 mt-3">Pasirink vieną atsakymą</div>`;document.getElementById('quizResult').classList.add('hidden');}
function answer(i){const q=quizQs[qIdx];const correct=i===q.a;answers.push(correct);if(correct)score++;const box=document.getElementById('quizBox');box.innerHTML=`<div class="text-xs bg-slate-100 px-2 py-1 rounded-full inline-block font-bold">${q.topic.toUpperCase()}</div><h3 class="font-extrabold text-lg mt-3">${q.q}</h3><div class="mt-3 p-3 rounded-xl ${correct?'bg-emerald-50 border border-emerald-200 text-emerald-800':'bg-red-50 border border-red-200 text-red-800'}"><b>${correct?'✓ Teisingai!':'✗ Neteisingai.'}</b> ${q.exp||''}</div><button onclick="nextQ()" class="w-full mt-4 bg-slate-900 text-white py-3 rounded-xl font-bold">Kitas →</button>`;}
function nextQ(){qIdx++;renderQuiz();}
function showResult(){const pct=Math.round(score/quizQs.length*100);let msg=pct>=80?"Puiku! 🌟":pct>=60?"Gerai! 👍":pct>=40?"Neplogai, pakartok korteles":"Reikia pasimokyti 📖";document.getElementById('quizBox').innerHTML=`<div class="text-center py-4"><div class="text-5xl">${pct>=80?'🏆':pct>=60?'🎉':'💪'}</div><h3 class="font-black text-2xl mt-2">${score}/${quizQs.length} (${pct}%)</h3><p class="font-bold text-slate-600">${msg}</p></div>`;document.getElementById('quizResult').classList.remove('hidden');document.getElementById('quizResult').innerHTML=`<h4 class="font-extrabold">Apžvalga</h4><div class="grid gap-1 mt-2 text-left text-sm">${quizQs.map((q,i)=>`<div class="flex gap-2 items-center"><span class="${answers[i]?'bg-emerald-100 text-emerald-700':'bg-red-100 text-red-700'} w-6 h-6 rounded-full flex items-center justify-center text-xs">${answers[i]?'✓':'✗'}</span><span class="flex-1">${i+1}. ${q.q}</span><span class="text-xs">${q.opts[q.a]}</span></div>`).join('')}</div><button onclick="initQuiz()" class="w-full mt-4 bg-blue-700 text-white py-3 rounded-xl font-bold">Kartoti testą</button>`;}
initQuiz();
</script>
