let cIdx=0, known=new Set(), unknown=new Set(), dalykas='istorija', view=[];
function currentView(){return dalykas==='pilietiskumas'?cards.filter(c=>c.d==='p'):cards.filter(c=>!c.d);}
function paintDalykasTabs(){document.getElementById('tabIstorija').className='px-3 py-1.5 rounded-full '+(dalykas==='istorija'?'bg-white shadow':'text-slate-500');document.getElementById('tabPilietiskumas').className='px-3 py-1.5 rounded-full '+(dalykas==='pilietiskumas'?'bg-white shadow':'text-slate-500');document.getElementById('dalykasName').textContent=dalykas==='pilietiskumas'?'— pilietiškumas':'— istorija';}
function setDalykas(d){dalykas=d;localStorage.setItem('dalykas',d);view=currentView();cIdx=0;known.clear();unknown.clear();paintDalykasTabs();renderCard();}
function initDalykas(){const p=new URLSearchParams(window.location.search);const d=p.get('dalykas');const t=p.get('topic');if(d==='pilietiskumas'){dalykas='pilietiskumas';localStorage.setItem('dalykas','pilietiskumas');}else if(d==='istorija'||t){dalykas='istorija';localStorage.setItem('dalykas','istorija');}else if(localStorage.getItem('dalykas')==='pilietiskumas'){dalykas='pilietiskumas';}view=currentView();paintDalykasTabs();}
function renderCard(){
  if(!view.length)view=currentView();
  document.getElementById('cardQ').textContent=view[cIdx].q;
  document.getElementById('cardA').textContent=view[cIdx].a;
  document.getElementById('cardExtra').textContent=view[cIdx].e;
  document.getElementById('cardNow').textContent=cIdx+1;
  document.getElementById('cardTotal').textContent=view.length;
  document.getElementById('flashCard').classList.remove('flipped');
  document.getElementById('knownCount').textContent=known.size;
  document.getElementById('unknownCount').textContent=unknown.size;
  document.getElementById('leftCount').textContent=view.length-known.size;
  const dots=document.getElementById('cardDots'); dots.innerHTML='';
  view.forEach((_,i)=>{const d=document.createElement('div');d.className='w-2 h-2 rounded-full '+(i===cIdx?'bg-blue-600 w-6':known.has(i)?'bg-emerald-400':'bg-slate-200');dots.appendChild(d);});
}
function flipCard(){document.getElementById('flashCard').classList.toggle('flipped');}
function nextCard(k){if(k===true){known.add(cIdx);unknown.delete(cIdx);}else if(k===false){unknown.add(cIdx);known.delete(cIdx);}cIdx=(cIdx+1)%view.length;renderCard();}
function prevCard(){cIdx=(cIdx-1+view.length)%view.length;renderCard();}
function shuffleCards(){for(let i=view.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[view[i],view[j]]=[view[j],view[i]]}cIdx=0;known.clear();unknown.clear();renderCard();}
initDalykas();
renderCard();
</script>
</body>
</html>
