<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kortelės — Istorija</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif}.hist-gradient{background:linear-gradient(135deg,#1e3a8a 0%,#3b82f6 50%,#9333ea 100%)}
.card-3d{perspective:1000px}.card-inner{transition:transform .6s;transform-style:preserve-3d}.card-3d.flipped .card-inner{transform:rotateY(180deg)}.card-face{backface-visibility:hidden}.card-back{transform:rotateY(180deg)}
</style>
</head>
<body class="bg-[#f8fafc] text-slate-800">
<nav class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3"><div class="w-9 h-9 hist-gradient rounded-xl flex items-center justify-center text-white font-black">🏛</div><div><div class="font-extrabold leading-none">Mokykis iš Džionio užrašų</div><div class="text-xs text-slate-500 -mt-0.5">Istorija</div></div></a>
    <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-full" id="navMenu">
      <a href="index.html" class="px-4 py-1.5 rounded-full font-bold text-sm text-slate-600 hover:bg-white">📖 Mokytis</a>
      <a href="korteles.html" class="px-4 py-1.5 rounded-full bg-white shadow font-bold text-sm">🃏 Kortelės</a>
      <a href="testas.html" class="px-4 py-1.5 rounded-full font-bold text-sm text-slate-600 hover:bg-white">✅ Testas</a>
      <a href="praktika.html" class="px-4 py-1.5 rounded-full font-bold text-sm text-slate-600 hover:bg-white">🧮 Praktika</a>
    </div>
  </div>
</nav>
<main class="max-w-6xl mx-auto px-4 py-6">
<div class="flex flex-wrap items-center justify-between gap-3 mb-4">
  <h1 class="font-black text-2xl">🃏 <span id="pageName">Kortelės</span> <span id="dalykasName" class="text-base font-bold text-slate-500">— istorija</span></h1>
  <div class="flex items-center gap-2"><div class="flex gap-1 bg-slate-100 p-1 rounded-full text-sm font-bold" id="dalykasTabs"><button onclick="setDalykas('istorija')" id="tabIstorija" class="px-3 py-1.5 rounded-full">📜 Istorija</button><button onclick="setDalykas('anglu')" id="tabAnglu" class="px-3 py-1.5 rounded-full">🇬🇧 Anglų</button><button onclick="setDalykas('ekonomika')" id="tabEkonomika" class="px-3 py-1.5 rounded-full">💰 Ekonomika</button><button onclick="setDalykas('biologija')" id="tabBiologija" class="px-3 py-1.5 rounded-full">🧬 Biologija</button></div><span class="text-sm"><span id="cardWord">Kortelė</span> <b id="cardNow">1</b> / <span id="cardTotal">24</span></span><button onclick="shuffleCards()" id="btnShuffle" class="text-xs bg-white border px-3 py-1.5 rounded-full font-bold">🔀 Maišyti</button></div>
</div>
<div class="max-w-2xl mx-auto">
  <div id="flashCard" class="card-3d cursor-pointer" onclick="flipCard()">
    <div class="card-inner relative">
      <div class="card-face bg-white border-2 border-blue-200 rounded-[20px] p-8 min-h-[280px] flex flex-col items-center justify-center text-center shadow-sm">
        <div class="text-xs font-bold tracking-widest text-blue-600" id="cardQLabel">KLAUSIMAS</div>
        <div id="cardQ" class="text-lg font-extrabold mt-3 whitespace-pre-wrap leading-relaxed"></div>
        <div class="text-xs text-slate-400 mt-4" id="cardHint">Paspausk, kad pamatytum atsakymą ↻</div>
      </div>
      <div class="card-face card-back absolute inset-0 bg-blue-700 rounded-[20px] p-8 min-h-[280px] flex flex-col items-center justify-center text-center text-white">
        <div class="text-xs font-bold tracking-widest text-blue-200" id="cardALabel">ATSAKYMAS</div>
        <div id="cardA" class="text-base font-bold mt-3 whitespace-pre-wrap leading-relaxed"></div>
        <div id="cardExtra" class="text-sm text-blue-100 mt-2 whitespace-pre-wrap"></div>
      </div>
    </div>
  </div>
  <div class="flex gap-3 mt-4">
    <button onclick="nextCard(false)" id="btnDontKnow" class="flex-1 bg-white border-2 border-slate-200 py-3 rounded-full font-bold">❌ Nežinojau</button>
    <button onclick="nextCard(true)" id="btnKnow" class="flex-1 bg-emerald-500 text-white py-3 rounded-full font-bold shadow">✓ Žinojau</button>
  </div>
  <div class="flex justify-center gap-2 mt-3">
    <button onclick="prevCard()" id="btnBack" class="bg-white border px-4 py-1.5 rounded-full text-sm font-bold">← Atgal</button>
    <button onclick="flipCard()" id="btnFlip" class="bg-slate-900 text-white px-4 py-1.5 rounded-full text-sm font-bold">Apversti ↻</button>
    <button onclick="nextCard()" id="btnNext" class="bg-white border px-4 py-1.5 rounded-full text-sm font-bold">Kita →</button>
  </div>
  <div class="flex justify-center gap-1 mt-4" id="cardDots"></div>
  <div class="bg-white border rounded-2xl p-3 mt-4 flex justify-between text-sm">
    <span><span id="statKnown">Žinau</span>: <b id="knownCount" class="text-emerald-600">0</b></span>
    <span><span id="statLearning">Mokausi</span>: <b id="unknownCount" class="text-amber-600">0</b></span>
    <span><span id="statLeft">Liko</span>: <b id="leftCount">24</b></span>
  </div>
  <div class="flex justify-center gap-3 mt-6">
    <a href="index.html" id="linkLearn" class="bg-white border px-6 py-2 rounded-full font-bold">← Mokytis</a>
    <a href="testas.html" id="linkTest" class="bg-blue-700 text-white px-6 py-2 rounded-full font-bold">Testas →</a>
  </div>
</div>
</main>
<script>
const cards=[
{q:"They ___ be in Spain now. (I'm sure)",a:"must",e:"must = I'm sure",d:"a"},
{q:"You ___ be serious! (impossible)",a:"can't",e:"can't = certainly NOT",d:"a"},
{q:"He ___ be upset. (perhaps)",a:"may / might",e:"perhaps = may/might",d:"a"},
{q:"Someone ___ changed my password. (I think so)",a:"must have changed",e:"sure → must + have + V3",d:"a"},
{q:"You ___ have got a new phone. (impossible)",a:"can't have got",e:"impossible → can't have + V3",d:"a"},
{q:"It ___ have been a burglar. (perhaps)",a:"might have been",e:"perhaps → might have + V3",d:"a"},
{q:"You ___ drive here. (forbidden ⛔)",a:"mustn't",e:"forbidden = mustn't",d:"a"},
{q:"You ___ stay. (not necessary ✅)",a:"don't have to",e:"no need, but you may",d:"a"},
{q:"We ___ have lied. (useless!)",a:"needn't have lied",e:"done but useless → needn't have",d:"a"},
{q:"He ___ solve it. (he succeeded)",a:"was able to",e:"one success = was able to",d:"a"},
{q:"___ I sit here? (permission 🙋)",a:"May",e:"May I…? = is it OK?",d:"a"},
{q:"The smuggler ___ arrested. (certain, passive)",a:"must have been",e:"certain passive → must have been + V3",d:"a"},
{q:"Asking permission: informal → ?",a:"Can I…?",e:"Could = politer, May/Might = formal",d:"a"},
{q:"Giving permission: spoken vs written?",a:"You can… (spoken) / You may… (formal, written)",e:"May = usually written notices",d:"a"},
{q:"Refusing permission: spoken vs notice?",a:"You can't / mustn't… (spoken) / You may not… (notice)",e:"May not = formal written ban",d:"a"},
{q:"Requests: informal → polite → very formal?",a:"Can/Will → Could/Would → May/Might",e:"Climbing politeness ladder 🪜",d:"a"},
{q:"must (I decided) vs have to (…)?",a:"Have to = someone else decided",e:"I must = my decision / I have to = boss's decision",d:"a"},
{q:"Advice: should vs MUST?",a:"Should/ought to = advice / Must = STRONG advice",e:"You must revise! = I strongly advise you",d:"a"},
{q:"Suggestions: which three?",a:"Shall we…? / Why don't we…? / How about…?",e:"All make suggestions",d:"a"},
{q:"Ability: present / past repeated / past single?",a:"can / could / was able to",e:"Tony was able to win = one managed win",d:"a"},
{q:"No ability: present / past?",a:"can't / couldn't",e:"She couldn't reach it, though she tried",d:"a"},
{q:"Offers: which modals?",a:"Shall / Can / Could I help…?",e:"Would you like me to…? = the same offer",d:"a"},
{q:"Criticism of the past: ?",a:"should / ought to + have + V3",e:"He should have told = it would have been better",d:"a"},
{q:"Kas yra alternatyvieji kaštai?",a:"Geriausia alternatyva, kurios atsisakome",e:"Ne visi pinigai – tik geriausia prarasta",d:"e"},
{q:"Jonas renkas ekonomiką (norai: ekonomistų, krepšinio…). Kaštai?",a:"Krepšinio būrelis – antra pagal svarbumą",e:"Antra alternatyva = kaštai",d:"e"},
{q:"Pica 4 eur vietoj mėsainio. Picos kaštai?",a:"Mėsainis",e:"Tik geriausia prarasta alternatyva",d:"e"},
{q:"Kodėl stygius visur?",a:"Norai neriboti, ištekliai riboti",e:"Begaliniai norai vs ribotumas",d:"e"},
{q:"4 gamybos ištekliai?",a:"Žmogiškieji, gamtos, kapitalo, verslumas",e:"Raktas ŽGKV",d:"e"},
{q:"Pinigai – kapitalas?",a:"NE. Fabrikai, mašinos – taip",e:"Pinigai – ne fizinis kapitalas",d:"e"},
{q:"Baldai – gamtos ištekliai?",a:"NE. Miškai, oras, nafta – taip",e:"Baldai jau pagaminti",d:"e"},
{q:"3 sistemos vienu žodžiu?",a:"Tradicinė – tradicijos / Rinkos – pelnas / Komandinė – planas",e:"Kas sprendžia ir kaip",d:"e"},
{q:"GGK: ant / po / virš?",a:"Efektyvi / neefektyvi / neįmanoma",e:"Ant = viskas panaudota",d:"e"},
{q:"Pamoka 45 min: A 20+20, B 25+25?",a:"A – galima neefektyvi / B – neįmanoma",e:"40<45, bet švaistoma / 50>45",d:"e"},
{q:"Rokas ir Simas: kas kur?",a:"Rokas → matematika, Simas → fizika (19 – geriausia)",e:"Palyginamasis pranašumas",d:"e"},
{q:"Mikro vs makro?",a:"Tėtis bankrutavo – mikro / Nedarbas šalyje – makro",e:"Asmuo/įmonė vs visa šalis",d:"e"},
{q:"Kas buvo Steigiamasis Seimas?",a:"1920–1922 Kaune dirbęs pirmasis parlamentas",e:"Sukūrė valstybės pagrindus ir valdymo formą"},
{q:"Seimo pirmininkas ir prezidentas?",a:"Stulginskis (pirmininkas) / Smetona (prezidentas)",e:"Stulginskis vėliau antras prezidentas"},
{q:"1920 rinkimai: kaip ir kiek?",a:"Tik partijų sąrašai, ne visur, bet ~90% rinkėjų",e:"Dabar mišri sistema ir ~50%"},
{q:"Kiek aktų? Kokie svarbiausi?",a:"~300; proklamavimas 1920-05-15, litas, Tautų Sąjunga",e:"Iki 1922 rudens"},
{q:"Kas yra de jure?",a:"Teisiškas oficialus pripažinimas + ambasados",e:"De jure = visam laikui teisiškai"},
{q:"Žemės reformos tikslas?",a:"Tvirtas ūkis iš smulkių/vidutinių ūkių",e:"Ūkio pagrindas – valstiečiai"},
{q:"Parlamentinis valdymas?",a:"Parlamentas – centras, renka prezidentą",e:"Seimas sudaro kitus organus"},
{q:"Petkevičaitė-Bitė?",a:"Vyriausia parlamentarė, pirmasis posėdis",e:"Atidarė 1920-05-15 posėdį"},
{q:"Stulginskis – kas?",a:"Seimo pirmininkas, skelbė proklamavimą",e:"Vėliau antras prezidentas"},
{q:"4 partijos ir lyderiai?",a:"Krikdemai (Stulginskis), tautininkai (Smetona), liaudininkai (Sleževičius), socdemai (Kairys)",e:"K-L-T-S raktas"},
{q:"Krikdemai vs tautininkai?",a:"Krikščionybė politikoje vs tautinė valstybė + nacionalizmas",e:"Tautininkai (Smetona, Voldemaras) – mažas palaikymas"},
{q:"Kas yra koalicija?",a:"Partijų sąjunga bendram tikslui (kai ni viena neturi daugumos)",e:"Kaip I Seime"},
{q:"I Seimas: kas laimėjo ir kas vadovavo?",a:"Krikdemų blokas; Stulginskis + Galvanauskas",e:"Be daugumos – koalicija"},
{q:"II Seimas (1923–1926)?",a:"Stulginskis + Galvanauskas; cenzūra, karo padėtis, Klaipėda",e:"Dirbo visą kadenciją"},
{q:"III Seimas (1926–1927)?",a:"Grinius; panaikinta karo padėtis, mirtis, cenzūra",e:"Po perversmo – Smetona"},
{q:"IV Seimas (1936)?",a:"Nedemokratinis, nuo prezidento, be mažumų ir moterų",e:"Visiška priešingybė I Seimui"},
{q:"Klaipėda: kaip atgauta?",a:"1923-01-10–15 sukilimu",e:"Prieš tai – Santarvė + prancūzai + direktorija"},
{q:"Klaipėda: kodėl Lietuvai?",a:"Uostas, prekyba, etninės žemės",e:"Vandens keliai + lietuviai"},
{q:"Ambasadorių konferencija ir direktorija?",a:"Santarvės organas + vietos administracija",e:"Sprendė krašto likimą"},
{q:"Kas yra DNR?",a:"Paveldima genetinė informacija",e:"Deoksiribonukleorūgštis",d:"b"},
{q:"Nukleotidas = ?",a:"Bazė + deoksiribozė + fosfatas (P)",e:"3 dalys – BCF raktas",d:"b"},
{q:"Bazės ATCG?",a:"Adeninas, timinas, citozinas, guaninas",e:"Pirmos raidės ATCG",d:"b"},
{q:"Poros DNR?",a:"A–T ir C–G (komplementarumas)",e:"A su T, C su G – visada",d:"b"},
{q:"Purinai vs pirimidinai?",a:"A,G – ilgos (purinai) / C,T – trumpos (pirimidinai)",e:"Ilgos AG, trumpos CT",d:"b"},
{q:"DNR forma?",a:"Susisukusi dviguba spiralė",e:"Kopėčios susisukusios",d:"b"},
{q:"Helikazė vs polimerazė?",a:"Helikazė išvynioja, polimerazė sujungia",e:"H – atidaro, P – stato",d:"b"},
{q:"Replikacija?",a:"3 etapai → 2 identiškos DNR",e:"Išsisukiojimas, poravimas, pabaiga",d:"b"},
{q:"Chromosoma = ?",a:"DNR + baltymai (centromera, chromatidės)",e:"Susivyniojusi DNR",d:"b"},
{q:"Kariotipas? Kiek?",a:"Visuma; 46 = 44 autosomos + XX/XY",e:"44 vienodos + 2 lytinės",d:"b"},
{q:"2n vs n?",a:"2n diploidinis (somatinės 46) / n haploidinis (lytinės 23)",e:"Dvigubas vs viengubas",d:"b"},
{q:"Mutacija? Mutagenai?",a:"Negrįžtamas pokytis; fiziniai/cheminiai/biologiniai",e:"UV, kancerogenai, virusai",d:"b"},
{q:"Dauno, poliploidija, albinizmas?",a:"47 chromosomos / rinkinio padaugėjimas / genų mutacija",e:"Skaičiaus, rinkinio, geno",d:"b"},
{q:"Ką paveldi vaikai?",a:"Tik lytinių ląstelių DNR (23+23)",e:"Po 23 iš kiekvieno tėvo",d:"b"}
];
let cIdx=0, known=new Set(), unknown=new Set(), dalykas='istorija', view=[];
function currentView(){if(dalykas==='anglu')return cards.filter(c=>c.d==='a');if(dalykas==='ekonomika')return cards.filter(c=>c.d==='e');if(dalykas==='biologija')return cards.filter(c=>c.d==='b');return cards.filter(c=>!c.d);}
function paintDalykasTabs(){const names={istorija:'— istorija',anglu:'— English',ekonomika:'— ekonomika',biologija:'— biologija'};['istorija','anglu','ekonomika','biologija'].forEach(function(k){const btn=document.getElementById(k==='istorija'?'tabIstorija':(k==='anglu'?'tabAnglu':(k==='ekonomika'?'tabEkonomika':'tabBiologija')));btn.className='px-3 py-1.5 rounded-full '+(dalykas===k?'bg-white shadow':'text-slate-500');});document.getElementById('dalykasName').textContent=names[dalykas]||names.istorija;paintCardsLang();}
function paintCardsLang(){const EN=dalykas==='anglu';const set=function(id,lt,en){document.getElementById(id).textContent=EN?en:lt;};set('cardQLabel','KLAUSIMAS','QUESTION');set('cardALabel','ATSAKYMAS','ANSWER');set('cardHint','Paspausk, kad pamatytum atsakymą ↻','Tap to see the answer ↻');set('btnDontKnow','❌ Nežinojau',"❌ I didn't know");set('btnKnow','✓ Žinojau','✓ I knew');set('btnBack','← Atgal','← Back');set('btnFlip','Apversti ↻','Flip ↻');set('btnNext','Kita →','Next →');set('statKnown','Žinau','I know');set('statLearning','Mokausi','Learning');set('statLeft','Liko','Left');set('linkLearn','← Mokytis','← Learn');set('linkTest','Testas →','Test →');set('pageName','Kortelės','Flashcards');set('cardWord','Kortelė','Card');set('btnShuffle','🔀 Maišyti','🔀 Shuffle');const tabNames=EN?{istorija:'📜 History',anglu:'🇬🇧 English',ekonomika:'💰 Economics',biologija:'🧬 Biology'}:{istorija:'📜 Istorija',anglu:'🇬🇧 Anglų',ekonomika:'💰 Ekonomika',biologija:'🧬 Biologija'};set('tabIstorija',tabNames.istorija,tabNames.istorija);set('tabAnglu',tabNames.anglu,tabNames.anglu);set('tabEkonomika',tabNames.ekonomika,tabNames.ekonomika);set('tabBiologija',tabNames.biologija,tabNames.biologija);const nav=EN?{'index.html':'📖 Learn','korteles.html':'🃏 Flashcards','testas.html':'✅ Test','praktika.html':'🧮 Practice'}:{'index.html':'📖 Mokytis','korteles.html':'🃏 Kortelės','testas.html':'✅ Testas','praktika.html':'🧮 Praktika'};document.querySelectorAll('#navMenu a').forEach(function(a){const f=a.getAttribute('href');if(nav[f])a.textContent=nav[f];});}
function setDalykas(d){dalykas=d;localStorage.setItem('dalykas',d);view=currentView();cIdx=0;known.clear();unknown.clear();paintDalykasTabs();renderCard();}
function initDalykas(){const p=new URLSearchParams(window.location.search);const d=p.get('dalykas');const t=p.get('topic');if(d==='anglu'||d==='ekonomika'||d==='biologija'){dalykas=d;localStorage.setItem('dalykas',d);}else if(d==='istorija'||t){dalykas='istorija';localStorage.setItem('dalykas','istorija');}else{const ls=localStorage.getItem('dalykas');dalykas=(ls==='anglu'||ls==='ekonomika'||ls==='biologija')?ls:'istorija';}view=currentView();paintDalykasTabs();}
function renderCard(){
  if(!view.length)view=currentView();
  document.getElementById('cardQ').textContent=view[cIdx].q;
  document.getElementById('cardA').textContent=view[cIdx].a;
  document.getElementById('cardExtra').textContent=view[cIdx].e;
  document.getElementById('cardNow').textContent=cIdx+1;
  document.getElementById('cardTotal').textContent=view.length;
  document.getElementById('flashCard').classList.remove('flipped');
  document.getElementById('knownCount').textContent=known.size;
  document.getElementById('unknownCount').textContent=unknown.size;
  document.getElementById('leftCount').textContent=view.length-known.size;
  const dots=document.getElementById('cardDots'); dots.innerHTML='';
  view.forEach((_,i)=>{const d=document.createElement('div');d.className='w-2 h-2 rounded-full '+(i===cIdx?'bg-blue-600 w-6':known.has(i)?'bg-emerald-400':'bg-slate-200');dots.appendChild(d);});
}
function flipCard(){document.getElementById('flashCard').classList.toggle('flipped');}
function nextCard(k){if(k===true){known.add(cIdx);unknown.delete(cIdx);}else if(k===false){unknown.add(cIdx);known.delete(cIdx);}cIdx=(cIdx+1)%view.length;renderCard();}
function prevCard(){cIdx=(cIdx-1+view.length)%view.length;renderCard();}
function shuffleCards(){for(let i=view.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[view[i],view[j]]=[view[j],view[i]]}cIdx=0;known.clear();unknown.clear();renderCard();}
initDalykas();
renderCard();
</script>
</body>
</html>
